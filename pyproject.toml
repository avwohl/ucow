[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ucow"
dynamic = ["version"]
description = "A Cowgol compiler for 8080/Z80 CP/M"
readme = "README.md"
license = "GPL-2.0-only"
requires-python = ">=3.11"
authors = [
    { name = "David Given" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v2 (GPLv2)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Compilers",
]
keywords = ["cowgol", "compiler", "8080", "z80", "cpm"]

# src/uplox_cowgol.py imports uplox.lex.scanner and uplox.parse.runtime at
# module level, so the generated parser cannot load without it. 0.3.0 had no
# dependency here because the front end was self-contained; 0.4.0 replaced it
# with a uplox-generated one. uplox itself requires Python 3.11, which is what
# sets requires-python above.
dependencies = [
    "uplox>=3.3.0",
]

[project.scripts]
ucow = "src.main:main"

[project.urls]
Homepage = "https://github.com/avwohl/ucow"
Repository = "https://github.com/avwohl/ucow"

[tool.hatch.version]
path = "src/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src", "lib", "cowgol_compat"]

[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "lib/",
    "cowgol_compat/",
    "README.md",
    "LICENSE",
]
